name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest -v test_emulator.py

      - name: Validate JSON examples
        shell: pwsh
        run: |
          Get-Content -LiteralPath ./config.example.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath ./replay-map.example.json -Raw | ConvertFrom-Json | Out-Null

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($Path in @('./setup_lab_route.ps1', './remove_lab_route.ps1')) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $Path),
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failure: $Path"
            }
          }
